<html lang="en">
<head>
  <title>OBMC | Enroll</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgV83OrFJd0dp_sgKYf5BYbKIWlOLwH1Zw0v5_zojG4xyDweBpgmlyPS6BMw&s" alt="OBMC Logo" height="45px" class="rounded bg-white p-1">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html" target="_self">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html" target="_self">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="enroll.html" target="_self">Enroll</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html" target="_self">Contact Us</a>
        </li>
      </ul>
      <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Search">
        <button class="btn btn-primary" type="button">Search</button>
      </form>
    </div>
  </div>
</nav>

<!-- Banner -->
<div class="banner text-center text-white p-5">
  <h1 class="display-5 fw-bold">Student Enrollment</h1>
  <p class="lead">Fill out the form below to apply for the upcoming school year.</p>
</div>

<!-- Main Content -->
<div class="container my-5">
  <div class="p-5 bg-light text-dark rounded shadow-sm">
    
    <!-- Header with Logo -->
    <div class="row align-items-center mb-4">
      <div class="col-md-8">
        <h2 class="fw-bold mb-2">Application Form</h2>
        <p class="text-muted mb-0">Complete the details below to start your OBMC journey.</p>
      </div>
      <div class="col-md-4 text-center text-md-end mt-3 mt-md-0">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgV83OrFJd0dp_sgKYf5BYbKIWlOLwH1Zw0v5_zojG4xyDweBpgmlyPS6BMw&s" class="img-fluid rounded" alt="OBMC Logo" style="max-height: 110px;">
      </div>
    </div>
    
    <form>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Student Full Name</label>
          <input type="text" class="form-control" placeholder="Enter student's full name" required>
        </div>
        <div class="col-md-6 mt-3 mt-md-0">
          <label class="form-label fw-bold">Birthdate</label>
          <input type="date" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Program / Grade Level</label>
          <select class="form-select">
            <option selected>Select a program...</option>
            <option value="casa">Casa (Preschool)</option>
            <option value="primary">Primary (Grades 1 - 3)</option>
            <option value="intermediate">Intermediate (Grades 4 - 6)</option>
            <option value="highschool">High School (Grades 7 - 12)</option>
          </select>
        </div>
        <div class="col-md-6 mt-3 mt-md-0">
          <label class="form-label fw-bold">Preferred Campus</label>
          <select class="form-select">
            <option selected>Select a campus...</option>
            <option value="greenhills">Greenhills</option>
            <option value="laspinas">Las Piñas</option>
            <option value="fairview">Fairview</option>
            <option value="angeles">Angeles</option>
            <option value="staana">Sta. Ana</option>
          </select>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label class="form-label fw-bold">Parent / Guardian Name</label>
          <input type="text" class="form-control" placeholder="Enter parent or guardian's name" required>
        </div>
        <div class="col-md-6 mt-3 mt-md-0">
          <label class="form-label fw-bold">Contact Email</label>
          <input type="email" class="form-control" placeholder="name@example.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Submit Application</button>
    </form>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-auto">
  <p class="mb-0">OBMC © 2026 | All Rights Reserved</p>
</footer>

</body>
</html>
